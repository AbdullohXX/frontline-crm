name: Sync Explee hot leads
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: explee-hot-leads
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger secured Vercel ingestion
        env:
          CRON_SECRET: ${{ secrets.EXPLEE_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --max-time 300 \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://frontline-crm-two.vercel.app/api/cron/explee
